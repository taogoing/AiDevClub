name: Deploy to Production

on:
  push:
    branches: [master, main]
  workflow_dispatch:

env:
  SERVER_HOST: ${{ secrets.SERVER_HOST }}
  SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
  DEPLOY_DIR: /opt/aidevclub

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker build -t aidevclub-backend -f deploy/Dockerfile.backend .

      - name: Build frontend image
        run: docker build -t aidevclub-frontend -f deploy/Dockerfile.frontend .

      - name: Save Docker images
        run: |
          mkdir -p /tmp/aidevclub-deploy
          docker save aidevclub-backend | gzip > /tmp/aidevclub-deploy/backend.tar.gz
          docker save aidevclub-frontend | gzip > /tmp/aidevclub-deploy/frontend.tar.gz

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Create remote directory
        run: |
          ssh -i ~/.ssh/deploy_key ${{ env.SERVER_USERNAME }}@${{ env.SERVER_HOST }} \
            "mkdir -p ${{ env.DEPLOY_DIR }}"

      - name: Copy files to server
        run: |
          scp -i ~/.ssh/deploy_key \
            /tmp/aidevclub-deploy/backend.tar.gz \
            /tmp/aidevclub-deploy/frontend.tar.gz \
            deploy/docker-compose.prod.yml \
            deploy/obtain-cert.sh \
            ${{ env.SERVER_USERNAME }}@${{ env.SERVER_HOST }}:${{ env.DEPLOY_DIR }}/
          ssh -i ~/.ssh/deploy_key ${{ env.SERVER_USERNAME }}@${{ env.SERVER_HOST }} \
            "mv ${{ env.DEPLOY_DIR }}/docker-compose.prod.yml ${{ env.DEPLOY_DIR }}/docker-compose.yml"

      - name: Create .env on server
        run: |
          ssh -i ~/.ssh/deploy_key ${{ env.SERVER_USERNAME }}@${{ env.SERVER_HOST }} 'cat > /opt/aidevclub/.env << ENVEOF
MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
JWT_SECRET=${{ secrets.JWT_SECRET }}
PUBLIC_BASE_URL=https://aidevclub.xyz
ADMIN_EMAILS=${{ secrets.ADMIN_EMAILS }}
CERTBOT_EMAIL=${{ secrets.CERTBOT_EMAIL }}
ENVEOF'

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/deploy_key ${{ env.SERVER_USERNAME }}@${{ env.SERVER_HOST }} << 'EOF'
          cd /opt/aidevclub
          echo "Loading Docker images..."
          docker load -i backend.tar.gz
          docker load -i frontend.tar.gz
          echo "Starting services..."
          docker compose up -d
          echo "Obtaining TLS certificate (HTTPS)..."
          bash obtain-cert.sh
          echo "Checking service status..."
          docker compose ps
          echo "Cleaning up..."
          rm -f backend.tar.gz frontend.tar.gz
          EOF

      - name: Cleanup local files
        if: always()
        run: rm -rf /tmp/aidevclub-deploy

      - name: Verify deployment
        run: |
          sleep 10
          curl -sf https://aidevclub.xyz/healthz || echo "Health check failed"
