name: CI

on:
  push:
    branches: [ master, p3-ai-resources ]
  pull_request:
    branches: [ master ]

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: aidevclub_test
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Build
      run: go build ./...

    - name: Run tests
      run: go test ./...
      env:
        AIDEVCLUB_TEST_MYSQL_DSN: root:root@tcp(localhost:3306)/aidevclub_test?charset=utf8mb4&parseTime=True&loc=Local
        AIDEVCLUB_TEST_REDIS_ADDR: localhost:6379

  frontend:
    name: Frontend (Vue)
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci
      working-directory: frontend

    - name: Type check
      run: npm run typecheck
      working-directory: frontend

    - name: Build
      run: npm run build
      working-directory: frontend
