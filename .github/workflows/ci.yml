name: CI

on:
  push:
    branches: [ master, p3-ai-resources ]
  pull_request:
    branches: [ master ]

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: aidevclub_test
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Build
      run: go build ./...

    - name: Run tests
      run: go test -p 1 ./...
      env:
        AIDEVCLUB_TEST_MYSQL_DSN: root:root@tcp(localhost:3306)/aidevclub_test?charset=utf8mb4&parseTime=True&loc=Local
        AIDEVCLUB_TEST_REDIS_ADDR: localhost:6379

  frontend:
    name: Frontend (Vue)
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci
      working-directory: frontend

    - name: Type check
      run: npm run typecheck
      working-directory: frontend

    - name: Build
      run: npm run build
      working-directory: frontend

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build backend image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: deploy/Dockerfile.backend
        push: false
        load: true
        tags: aidevclub-backend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build frontend image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: deploy/Dockerfile.frontend
        push: false
        load: true
        tags: aidevclub-frontend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Save Docker images
      run: |
        mkdir -p /tmp/deploy
        docker save aidevclub-backend | gzip > /tmp/deploy/backend.tar.gz
        docker save aidevclub-frontend | gzip > /tmp/deploy/frontend.tar.gz

    - name: Deploy to server
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        SERVER_IP: ${{ secrets.SERVER_IP }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        
        SSH_CMD="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@${SERVER_IP}"
        SCP_CMD="scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"
        
        $SSH_CMD "mkdir -p /opt/aidevclub"
        
        $SCP_CMD /tmp/deploy/backend.tar.gz root@${SERVER_IP}:/opt/aidevclub/
        $SCP_CMD /tmp/deploy/frontend.tar.gz root@${SERVER_IP}:/opt/aidevclub/
        $SCP_CMD deploy/docker-compose.prod.yml root@${SERVER_IP}:/opt/aidevclub/docker-compose.yml
        
        $SSH_CMD << 'ENDSSH'
        cd /opt/aidevclub
        docker load -i backend.tar.gz
        docker load -i frontend.tar.gz
        docker compose up -d
        rm -f backend.tar.gz frontend.tar.gz
        ENDSSH
