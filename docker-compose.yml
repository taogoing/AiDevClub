services:
  mysql:
    image: mysql:8
    command: --ngram-token-size=2
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: aidevclub
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
  redis:
    image: redis:7
    ports:
      - "16379:6379"

volumes:
  mysql_data:
